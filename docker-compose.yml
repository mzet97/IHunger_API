version: '3.8'

services:
  # ============================================
  # PostgreSQL 16 - Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: ihunger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ihunger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ihunger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ihunger}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # pgAdmin 4 - Database Management (opcional)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ihunger-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ihunger.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "${PGADMIN_PORT:-5050}:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ihunger-network

  # ============================================
  # IHunger API - .NET 10 Application
  # ============================================
  api:
    build:
      context: .
      dockerfile: IHunger/1 - Application/IHunger.WebAPI/Dockerfile
    container_name: ihunger-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Docker}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Pooling=true;Database=${POSTGRES_DB:-ihunger};User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      AppSettings__Secret: ${JWT_SECRET:-SXN1bmdFUjEyMzQ1Njc4OTAxMjM0NTY3ODkw}
      AppSettings__ExpirationHours: ${JWT_EXPIRATION_HOURS:-24}
      AppSettings__Issuer: ${JWT_ISSUER:-IHunger}
      AppSettings__ValidOn: ${JWT_VALID_ON:-http://localhost:5000}
    ports:
      - "${API_HTTP_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ihunger-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Redis - Cache (opcional)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ihunger-redis
    restart: unless-stopped
    profiles:
      - cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ihunger-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  ihunger-network:
    driver: bridge
